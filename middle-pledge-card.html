<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Zero Waste Pledge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#DCEEFB;
  --blob:#CBE4F8;
  --panel:#FFFFFF;
  --frame:#BFDCF5;
  --navy:#0F2A6B;
  --blue:#1668E3;
  --rule:#7FB3E8;
  --pill:#DCEAFB;
  --yellow:#FCE79A;
  --spark:#F9C43F;
  --wash:#BFDBF2;
}
*{box-sizing:border-box}
body{
  margin:0; background:#EAF4FC; color:var(--navy);
  font-family:"Poppins","Baloo Bhaijaan 2",system-ui,sans-serif;
  display:flex; flex-direction:column; align-items:center; padding:24px 16px 44px;
}
html[dir="rtl"] body{font-family:"Baloo Bhaijaan 2","Poppins",system-ui,sans-serif}

.lang{
  align-self:flex-end; display:flex; margin:0 0 14px; background:#fff;
  border:2px solid var(--frame); border-radius:999px; overflow:hidden;
}
.lang button{
  font-family:inherit; font-size:14px; font-weight:700; cursor:pointer;
  border:0; background:transparent; color:var(--blue); padding:8px 18px;
}
.lang button.on{background:var(--blue); color:#fff}

/* ================= card ================= */
.card{
  position:relative; width:min(1180px,100%); background:var(--sky);
  padding:26px 40px 22px; overflow:hidden;
  box-shadow:0 22px 50px -32px rgba(15,42,107,.55);
}
.blobs{position:absolute; inset:0; pointer-events:none}
.blobs span{position:absolute; background:var(--blob); border-radius:50%}
.b1{width:230px; height:190px; left:-90px; top:-60px; border-radius:48% 52% 60% 40%/55% 45% 55% 45%}
.b2{width:150px; height:130px; left:-56px; bottom:34px; border-radius:52% 48% 44% 56%/48% 56% 44% 52%}
.b3{width:210px; height:120px; right:-80px; bottom:-40px; border-radius:56% 44% 50% 50%/52% 48% 52% 48%}
.b4{width:96px; height:80px; right:16%; bottom:-34px; border-radius:50%}

.wash{position:absolute; inset:0; pointer-events:none; opacity:.85}
.wash svg{width:100%; height:100%}

.inner{position:relative; z-index:2}

/* ---- logo ---- */
.logo{display:flex; align-items:center; justify-content:center}
.lockup{width:302px; max-width:64%; height:auto; display:block}
.tagline{
  text-align:center; font-family:"Poppins",sans-serif; font-size:11px; font-weight:600;
  letter-spacing:.24em; color:#0E2340; margin:6px 0 0;
}

/* ---- title with marker highlight ---- */
.titlewrap{position:relative; text-align:center; margin:12px 0 18px}
h1{
  margin:0; font-size:clamp(30px,4.6vw,52px); font-weight:700; color:var(--navy);
  line-height:1.15; display:inline-block; position:relative; z-index:2;
}
h1 .hl{
  position:relative; color:var(--blue); padding:0 12px;
}
h1 .hl::before{
  content:""; position:absolute; inset:8% -2px 6%; background:var(--yellow);
  border-radius:14px; z-index:-1;
}
.spark{position:absolute; top:50%; width:70px; height:60px; transform:translateY(-58%)}
.spark.l{left:2%} .spark.r{right:2%}
.spark i{position:absolute; display:block; background:var(--spark); border-radius:6px; height:9px}
.spark.l i:nth-child(1){width:34px; top:2px;  left:16px; transform:rotate(-38deg)}
.spark.l i:nth-child(2){width:30px; top:26px; left:2px;  transform:rotate(-6deg)}
.spark.l i:nth-child(3){width:30px; top:46px; left:14px; transform:rotate(30deg)}
.spark.r i:nth-child(1){width:34px; top:2px;  right:16px; transform:rotate(38deg)}
.spark.r i:nth-child(2){width:30px; top:26px; right:2px;  transform:rotate(6deg)}
.spark.r i:nth-child(3){width:30px; top:46px; right:14px; transform:rotate(-30deg)}

/* ---- white panel ---- */
.panel{
  background:var(--panel); border:9px solid var(--frame); border-radius:30px;
  padding:26px 34px 34px;
}
.frow{display:flex; align-items:flex-end; gap:14px; margin-bottom:22px}
.lbl{font-weight:700; font-size:21px; color:var(--navy); white-space:nowrap; padding-bottom:6px}
.uline{flex:1; min-width:0; border-bottom:2px solid var(--rule)}
.uline input, .uline select{
  width:100%; font-family:inherit; font-size:19px; font-weight:600; color:var(--navy);
  border:0; outline:none; background:transparent; padding:4px 2px 7px;
}
.uline input::placeholder{color:#A9C6E6; font-weight:500}
.uline select{cursor:pointer; appearance:none}
.uline:focus-within{border-bottom-color:var(--blue)}
.divider{width:2px; height:38px; background:var(--rule); flex:none; margin:0 6px}

.pillrow{margin-bottom:10px}
.pill{
  display:inline-block; background:var(--pill); color:var(--navy);
  font-weight:700; font-size:21px; border-radius:999px; padding:8px 22px;
}
.pline{border-bottom:2px solid var(--rule); margin-top:22px; position:relative}
.pline select{
  width:100%; font-family:inherit; font-size:18px; font-weight:600; color:var(--navy);
  border:0; outline:none; background:transparent; padding:6px 28px 8px 4px;
  cursor:pointer; appearance:none;
}
html[dir="rtl"] .pline select{padding:6px 4px 8px 28px}
.pline select:invalid{color:#A9C6E6; font-weight:500}
.pline::after{
  content:""; position:absolute; right:8px; bottom:12px; width:9px; height:9px;
  border-right:3px solid var(--blue); border-bottom:3px solid var(--blue);
  transform:rotate(45deg); pointer-events:none;
}
html[dir="rtl"] .pline::after{right:auto; left:8px}
.pline:focus-within{border-bottom-color:var(--blue)}

.foot{
  text-align:center; margin:18px 0 2px; font-size:clamp(17px,2.2vw,25px);
  font-weight:700; color:var(--navy);
}
.foot b{color:var(--blue); font-weight:700}

/* ================= actions, outside the card ================= */
.actions{
  width:min(1180px,100%); display:flex; gap:12px; align-items:center;
  margin-top:20px; flex-wrap:wrap;
}
.btn{
  font-family:inherit; font-size:17px; font-weight:700; cursor:pointer;
  border-radius:14px; padding:14px 26px; border:2px solid transparent;
  transition:transform .12s, background .18s;
}
.btn.primary{background:var(--blue); color:#fff}
.btn.primary:hover{background:#0F58C9}
.btn.primary:active{transform:translateY(2px)}
.btn.ghost{background:#fff; color:var(--blue); border-color:var(--frame)}
.btn.ghost:hover{border-color:var(--blue)}
.msg{font-size:16px; font-weight:700; color:#C0492F; margin-inline-start:6px}
.msg.ok{color:#1B7F4B}
:focus-visible{outline:3px solid var(--blue); outline-offset:3px}

@media print{
  body{background:#fff; padding:0}
  .lang,.actions{display:none}
  .card{box-shadow:none; width:100%}
}
@media (max-width:760px){
  .card{padding:22px 18px 18px}
  .panel{padding:20px 18px 26px; border-width:7px; border-radius:22px}
  .frow{flex-wrap:wrap; gap:10px}
  .divider{display:none}
  .spark{display:none}
  .lockup{width:210px; max-width:78%}
}
</style>
</head>

        'أعيد استخدام البرطمانات والعلب بدل رميها.',
        'أحافظ على نظافة صفي ومقعدي كل يوم.',
        'لا أرمي شيئًا من نافذة السيارة.'
      ]
    }
  };

  var cur = 'en';

  /* faint icon wash */
  (function(){
    var ids=['i-bottle','i-can','i-paper','i-jar','i-sheets','i-peel'];
    var out='', k=0;
    for(var y=-14;y<640;y+=112){
      for(var x=-14;x<1215;x+=126){
        var jx=((k*41)%27)-13, jy=((k*59)%23)-11, r=((k*71)%54)-27;
        out+='<use href="#'+ids[k%ids.length]+'" transform="translate('+(x+jx)+' '+(y+jy)+') rotate('+r+')"/>';
        k++;
      }
    }
    document.getElementById('tiles').innerHTML=out;
  })();

  function fill(sel, items, hint){
    var v = sel.value;
    sel.innerHTML = '<option value="" disabled selected>'+hint+'</option>' +
      items.map(function(t,i){ return '<option value="'+i+'">'+t+'</option>'; }).join('');
    if(v!=='') sel.value = v;
  }

  function apply(code){
    cur = code;
    var t = T[code];
    document.documentElement.dir = t.dir;
    document.documentElement.lang = t.lang;
    $('title').innerHTML = t.title;
    $('lName').textContent = t.name;
    $('lGrade').textContent = t.grade;
    $('lDate').textContent = t.date;
    $('lPledge').textContent = t.pledge;
    $('foot').innerHTML = t.foot;
    $('save').textContent = t.save;
    $('print').textContent = t.print;
    $('reset').textContent = t.reset;
    fill($('grade'), t.grades, t.gradeHint);
    ['p1','p2','p3'].forEach(function(id){ fill($(id), t.pledges, t.pledgeHint); });
    $('btnEn').className = code==='en' ? 'on' : '';
    $('btnAr').className = code==='ar' ? 'on' : '';
    $('msg').textContent = '';
  }

  $('btnEn').addEventListener('click', function(){ apply('en'); });
  $('btnAr').addEventListener('click', function(){ apply('ar'); });

  var d = new Date();
  $('date').value = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

  apply('en');

  $('save').addEventListener('click', function(){
    var t = T[cur], m = $('msg');
    m.className = 'msg';
    if(!$('name').value.trim()){ m.textContent = t.needName; $('name').focus(); return; }
    if(!$('grade').value){ m.textContent = t.needGrade; $('grade').focus(); return; }
    var picks = ['p1','p2','p3'].map(function(id){ return $(id).value; }).filter(function(v){ return v!==''; });
    if(!picks.length){ m.textContent = t.needPledge; $('p1').focus(); return; }
    if(new Set(picks).size !== picks.length){ m.textContent = t.dupe; return; }
    m.className = 'msg ok';
    m.textContent = t.done;
  });

  $('print').addEventListener('click', function(){ window.print(); });

  $('reset').addEventListener('click', function(){
    $('name').value = '';
    $('grade').selectedIndex = 0;
    ['p1','p2','p3'].forEach(function(id){ $(id).selectedIndex = 0; });
    $('msg').textContent = '';
    $('name').focus();
  });
})();
</script>
</body>
</html>
