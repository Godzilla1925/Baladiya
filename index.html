@keyframes cardIn{from{opacity:0;transform:translateY(26px) scale(.975)}to{opacity:1;transform:none}}

/* ===== overlaid fields, sized to the printed boxes ===== */
.f{position:absolute;display:flex;align-items:center;border-radius:14px;
   transition:box-shadow .22s ease,background .22s ease;
   animation:fieldIn .5s ease both}
@keyframes fieldIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.f:hover{background:rgba(140,192,122,.10)}
.f:focus-within{background:rgba(140,192,122,.13);box-shadow:0 0 0 calc(var(--s)*4px) rgba(78,155,62,.28)}
.f.line{border-radius:6px}
.f.line:focus-within{box-shadow:0 calc(var(--s)*3px) 0 0 var(--green)}

.f input,.f select{
  width:100%;height:100%;border:0;background:transparent;outline:none;
  font-family:inherit;font-weight:700;color:var(--navy-deep);
  text-align:right;direction:rtl;
  padding:0 calc(var(--s)*34px) 0 calc(var(--s)*10px);
  font-size:calc(var(--s)*34px);
}
.f.line input,.f.line select{font-size:calc(var(--s)*27px);font-weight:600;
  padding:0 calc(var(--s)*10px) calc(var(--s)*6px) calc(var(--s)*34px)}
/* browsers vertically center a closed <select>'s text differently from an <input>'s,
   even with identical padding — nudge the "write your own pledge" input up to match */
.f.line input.own{padding-bottom:calc(var(--s)*30px)}
.f select{appearance:none;-webkit-appearance:none;cursor:pointer}
.f input{cursor:text}
.f input::placeholder{color:var(--muted);font-weight:500}
.f select.empty{color:var(--muted);font-weight:500}
.f input[type=date]::-webkit-calendar-picker-indicator{opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer}

/* dropdown arrow, sitting at the end of each printed box */
.f.sel::after{
  content:"";position:absolute;left:calc(var(--s)*14px);top:50%;
  width:calc(var(--s)*13px);height:calc(var(--s)*13px);
  border-left:calc(var(--s)*3.4px) solid var(--green);
  border-bottom:calc(var(--s)*3.4px) solid var(--green);
  transform:translateY(-70%) rotate(-45deg);pointer-events:none;
  transition:transform .22s ease;opacity:.85;
}
.f.sel:focus-within::after{transform:translateY(-22%) rotate(135deg)}
.f.line.sel::after{top:44%}
.f.typing::after{opacity:0}

.undo{position:absolute;left:calc(var(--s)*-30px);top:50%;transform:translateY(-50%);
  width:calc(var(--s)*26px);height:calc(var(--s)*26px);border:0;border-radius:50%;
  background:#DCEBD3;color:var(--green);cursor:pointer;display:none;
  align-items:center;justify-content:center;font-size:calc(var(--s)*18px);font-family:inherit;line-height:1}
.f.typing .undo{display:flex}

/* ===== stamp + falling leaves ===== */
.seal{position:absolute;z-index:6;top:50%;left:50%;
  width:calc(var(--s)*430px);height:calc(var(--s)*430px);border-radius:50%;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:calc(var(--s)*8px);border:calc(var(--s)*11px) solid var(--green);
  background:rgba(250,249,243,.95);color:var(--green);text-align:center;
  box-shadow:0 calc(var(--s)*22px) calc(var(--s)*50px) rgba(78,155,62,.3)}
.seal.show{display:flex;animation:stamp .6s cubic-bezier(.2,.9,.3,1.5) both}
@keyframes stamp{
  0%{opacity:0;transform:translate(-50%,-50%) scale(2.3) rotate(-16deg)}
  60%{opacity:1;transform:translate(-50%,-50%) scale(.93) rotate(-7deg)}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-9deg)}}
.seal b{font-size:calc(var(--s)*54px);font-weight:800;line-height:1.05}
.seal small{font-size:calc(var(--s)*27px);font-weight:600;color:var(--navy);padding:0 calc(var(--s)*34px);line-height:1.35}
.seal svg{width:calc(var(--s)*86px)}
.seal path{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .45s ease .3s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.leafbit{position:absolute;top:-8%;z-index:5;pointer-events:none;width:calc(var(--s)*54px)}

/* ===== controls under the card ===== */
.hint{min-height:22px;font-size:17px;font-weight:600;color:#C0492F;text-align:center}
.hint.ok{color:var(--green)}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{font-family:inherit;font-size:17px;font-weight:700;padding:11px 26px;border-radius:999px;
  border:2px solid transparent;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,background .16s ease}
.btn:active{transform:translateY(2px) scale(.985)}
.btn.primary{background:var(--green);color:#fff;box-shadow:0 6px 16px rgba(78,155,62,.34)}
.btn.primary:hover{background:#438934}
.btn.ghost{background:#fff;color:var(--navy);border-color:#C9D9E8}
.btn.ghost:hover{border-color:#1F63B4}
.btn:focus-visible,.f:focus-within{outline-offset:2px}

/* ===== language toggle (small AR/EN segmented switch) ===== */
.lang-toggle{width:100%;max-width:1180px;display:flex;justify-content:flex-end;padding:0 4px}
.lang-switch{display:inline-flex;border:2px solid var(--navy);border-radius:999px;overflow:hidden;background:#fff}
.lang-opt{font-family:inherit;font-size:12px;font-weight:800;letter-spacing:.02em;
  padding:5px 13px;border:0;background:transparent;color:var(--navy);cursor:pointer;
  transition:background .15s ease,color .15s ease}
.lang-opt.active{background:var(--navy);color:#fff;cursor:default}
.lang-opt:not(.active):hover{background:#EAF1FA}
.lang-panel{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%}
.lang-panel[hidden]{display:none}
@media print{ .lang-toggle{display:none} }

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}
@media print{
  body{background:#fff;padding:0}
  .actions,.hint,.undo{display:none}
  .scroller{overflow:visible;max-width:none}
  .card{box-shadow:none;border-radius:0;min-width:0}
  .f:focus-within,.f:hover{box-shadow:none;background:transparent}
  .f.sel::after{display:none}
  @page{size:landscape;margin:6mm}}
</style>
</head>

/* the same pledge can't be picked twice, within one card */
function lockDuplicates(scope){
  const sels=[...scope.querySelectorAll('select.pledge')];
  const taken=sels.map(s=>s.value).filter(v=>v&&v!=='__own__');
  sels.forEach(sel=>{
    [...sel.options].forEach(o=>{ if(o.value&&o.value!=='__own__')
      o.disabled = taken.includes(o.value)&&sel.value!==o.value; });
  });
}

/* wires up one language card: scales it, fills its pledge menus, and binds its fields + buttons */
function wireCard(cfg){
  const setScale=()=>cfg.card.style.setProperty('--s', cfg.card.clientWidth/cfg.designW);
  new ResizeObserver(setScale).observe(cfg.card); setScale();

  cfg.card.querySelectorAll('select.pledge').forEach(sel=>{
    sel.innerHTML = '<option value="">'+sel.dataset.ph+'</option>';
    cfg.pledges.forEach(p=>{ const o=document.createElement('option'); o.value=p; o.textContent=p; sel.appendChild(o); });
    const o=document.createElement('option'); o.value='__own__'; o.textContent=cfg.ownLabel; sel.appendChild(o);
  });

  function fit(el){
    const box=el.parentElement.clientWidth-24, base=cfg.card.clientWidth/cfg.designW*27;
    const c=fit.c||(fit.c=document.createElement('canvas').getContext('2d'));
    let size=base;
    const txt=el.tagName==='SELECT'?(el.options[el.selectedIndex]||{}).text||'':el.value;
    while(size>base*0.62){ c.font='600 '+size+'px "Baloo Bhaijaan 2", sans-serif';
      if(c.measureText(txt).width<=box) break; size-=0.5; }
    el.style.fontSize=size+'px';
  }

  cfg.card.querySelectorAll('.f.line').forEach(line=>{
    const sel=line.querySelector('select'), own=line.querySelector('input'), undo=line.querySelector('.undo');
    sel.addEventListener('change',()=>{
      sel.classList.toggle('empty', !sel.value);
      if(sel.value==='__own__'){ sel.hidden=true; own.hidden=false; line.classList.add('typing'); own.focus(); }
      else fit(sel);
      lockDuplicates(cfg.card);
    });
    own.addEventListener('input',()=>fit(own));
    undo.addEventListener('click',()=>{
      own.hidden=true; own.value=''; sel.hidden=false; sel.value=''; sel.classList.add('empty');
      line.classList.remove('typing'); lockDuplicates(cfg.card); sel.focus();
    });
  });

  cfg.gradeEl.addEventListener('change',()=>cfg.gradeEl.classList.toggle('empty',!cfg.gradeEl.value));
  cfg.dateEl.valueAsDate = new Date();

  function rawLines(){
    return [...cfg.card.querySelectorAll('.f.line')].map(l=>{
      const s=l.querySelector('select'), o=l.querySelector('input');
      return o.hidden ? (s.value==='__own__'?'':s.value) : o.value.trim();
    });
  }

  function leafRain(){
    if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    for(let i=0;i<20;i++){
      const img=new Image(); img.src=LEAF; img.className='leafbit';
      img.style.right=(5+Math.random()*90)+'%';
      img.style.opacity=.55+Math.random()*.45;
      cfg.card.appendChild(img);
      img.animate([
        {transform:'translateY(0) rotate(0deg)'},
        {transform:'translateY('+(cfg.card.clientHeight+90)+'px) rotate('+(300+Math.random()*420)+'deg)'}
      ],{duration:2000+Math.random()*1600,easing:'cubic-bezier(.35,.1,.5,1)'}).onfinish=()=>img.remove();
    }
  }

  cfg.submitBtn.addEventListener('click',()=>{
    const name=cfg.nameEl.value.trim(), g=cfg.gradeEl.value, lines=rawLines(), picks=lines.filter(Boolean);
    if(!name){ cfg.hintEl.className='hint'; cfg.hintEl.textContent=cfg.msgs.name; cfg.nameEl.focus(); return; }
    if(!g){ cfg.hintEl.className='hint'; cfg.hintEl.textContent=cfg.msgs.grade; cfg.gradeEl.focus(); return; }
    if(!picks.length){ cfg.hintEl.className='hint'; cfg.hintEl.textContent=cfg.msgs.pledge; return; }
    saveToSheet(name,g,cfg.dateEl.value,lines,cfg.lang);
    cfg.hintEl.className='hint ok'; cfg.hintEl.textContent=cfg.msgs.success;
    cfg.sealTextEl.textContent=name+' — '+g;
    cfg.sealEl.classList.remove('show'); void cfg.sealEl.offsetWidth; cfg.sealEl.classList.add('show');
    leafRain();
    setTimeout(()=>cfg.sealEl.classList.remove('show'),2600);
  });

  cfg.printBtn.addEventListener('click',()=>window.print());

  cfg.resetBtn.addEventListener('click',()=>{
    cfg.nameEl.value='';
    cfg.gradeEl.value=''; cfg.gradeEl.classList.add('empty');
    cfg.card.querySelectorAll('.f.line').forEach(l=>{
      const s=l.querySelector('select'), o=l.querySelector('input');
      o.hidden=true; o.value=''; s.hidden=false; s.value=''; s.classList.add('empty'); s.style.fontSize='';
      l.classList.remove('typing');
    });
    cfg.dateEl.valueAsDate=new Date();
    lockDuplicates(cfg.card); cfg.hintEl.textContent=''; cfg.sealEl.classList.remove('show');
    cfg.nameEl.focus();
  });
}

/* ---- Google Sheet saving ----
   1) Create a Google Sheet.
   2) Extensions > Apps Script, paste the doPost script provided separately, and deploy it
      as a Web App (Execute as: Me, Who has access: Anyone).
   3) Paste the deployment URL below, between the quotes. */
const SHEET_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxKJmVvpNZRHPaHN0KZAUP-AOtiaCMAjNh4nyMph33TpBRKWCjS-Mabj-HBnvgTurM4/exec';

function saveToSheet(name,g,dateVal,lines,lang){
  if(!SHEET_WEBAPP_URL || SHEET_WEBAPP_URL.indexOf('PASTE_YOUR')===0) return; // not configured yet
  const payload={ name:name, grade:g, date:dateVal, pledge1:lines[0]||'', pledge2:lines[1]||'', pledge3:lines[2]||'', lang:lang||'ar', submittedAt:new Date().toISOString() };
  fetch(SHEET_WEBAPP_URL,{
    method:'POST',
    mode:'no-cors',              /* Apps Script doesn't send CORS headers; no-cors still delivers the POST */
    headers:{'Content-Type':'text/plain;charset=utf-8'}, /* keep it a "simple request" so no preflight is needed */
    body:JSON.stringify(payload)
  }).catch(()=>{ /* network error only — the card still works offline */ });
}
