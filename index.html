<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تعهدي صفر نفايات | My Zero Waste Pledge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#EAF4FC; --panel:#FFFFFF; --frame:#CFE3F6;
  --navy:#0F2A6B; --blue:#1668E3; --deep:#0B1F4E;
  --muted:#5C7597; --yellow:#FCE79A;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; background:var(--sky); color:var(--navy);
  font-family:"Tajawal","Poppins",system-ui,sans-serif;
  display:flex; flex-direction:column; align-items:center;
  padding:32px 18px 56px;
}
html[dir="ltr"] body{font-family:"Poppins","Tajawal",system-ui,sans-serif}

.lang{
  align-self:flex-end; display:flex; margin-bottom:22px; background:#fff;
  border:2px solid var(--frame); border-radius:999px; overflow:hidden;
}
.lang button{
  font-family:inherit; font-size:14px; font-weight:700; cursor:pointer;
  border:0; background:transparent; color:var(--blue); padding:8px 20px;
}
.lang button.on{background:var(--blue); color:#fff}

.lockup{width:288px; max-width:74%; height:auto; display:block; margin:0 auto}
.tagline{
  text-align:center; font-family:"Poppins",sans-serif; font-size:11px; font-weight:600;
  letter-spacing:.24em; color:#0E2340; margin:8px 0 0;
}
h1{
  text-align:center; margin:22px 0 6px; font-size:clamp(28px,4.6vw,44px);
  font-weight:800; line-height:1.2;
}
h1 .hl{position:relative; color:var(--blue); padding:0 10px}
h1 .hl::before{
  content:""; position:absolute; inset:10% -2px 8%; background:var(--yellow);
  border-radius:12px; z-index:-1;
}
.sub{text-align:center; color:var(--muted); font-size:clamp(15px,2vw,19px); margin:0 0 34px}

.grid{
  display:grid; gap:20px; width:min(1080px,100%);
  grid-template-columns:repeat(3,1fr);
}
.tile{
  background:var(--panel); border:3px solid var(--frame); border-radius:24px;
  padding:30px 26px 26px; text-align:center; text-decoration:none; color:inherit;
  display:flex; flex-direction:column; align-items:center; gap:6px;
  transition:transform .16s, border-color .16s, box-shadow .16s;
}
.tile:hover,.tile:focus-visible{
  transform:translateY(-5px); border-color:var(--blue);
  box-shadow:0 18px 34px -22px rgba(15,42,107,.6); outline:none;
}
.badge{
  width:88px; height:88px; border-radius:50%; background:#EAF3FD;
  display:flex; align-items:center; justify-content:center; margin-bottom:12px;
}
.tile:hover .badge{background:#DCEBFB}
.badge svg{width:46px; height:46px}
.tile h2{margin:0; font-size:25px; font-weight:800; color:var(--navy)}
.tile .lvl{font-family:"Poppins",sans-serif; font-size:13px; font-weight:600;
  letter-spacing:.12em; color:var(--blue); text-transform:uppercase}
.tile .yrs{font-size:16px; color:var(--muted); font-weight:500; margin-top:4px}
.tile .go{
  margin-top:16px; background:var(--blue); color:#fff; font-weight:700; font-size:15px;
  border-radius:999px; padding:10px 24px;
}
.foot{
  margin-top:38px; text-align:center; font-size:clamp(15px,2vw,21px);
  font-weight:700; color:var(--navy);
}
.foot b{color:var(--blue)}
@media (max-width:820px){ .grid{grid-template-columns:1fr; gap:16px} }
</style>
</head>
